<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini Screen — Paramètres</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{margin:0;background:#111216;color:#f4f4f5}.wrap{width:min(680px,calc(100vw - 40px));margin:48px auto}.card{margin-top:22px;padding:22px;border:1px solid #2a2b30;border-radius:16px;background:#18191e}h1{margin:0 0 8px;font-size:26px}p{color:#a5a6ad;line-height:1.5}label{display:block;margin:18px 0 8px;font-size:13px;color:#d0d0d5}input{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #36373e;border-radius:10px;background:#101116;color:#fff;outline:none}.row{display:flex;gap:8px;margin-top:18px}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;background:#fff;color:#111;font-weight:650}button.secondary{background:#2a2b31;color:#eee}.hint{font-size:12px;color:#8c8d95}.saved{min-height:20px;margin-top:14px;color:#aaaab2;font-size:12px}</style></head><body><div class="wrap"><h1>Gemini Screen Chat</h1><p>La clé est stockée localement dans l’extension. Tu peux la remplacer à tout moment.</p><div class="card"><label for="apiKey">Clé API Gemini</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…"><div class="hint">Modifie-la ici quand tu changes de clé ou de quota.</div><label for="model">Modèle Gemini</label><input id="model" type="text" value="gemini-3.5-flash-lite" autocomplete="off" spellcheck="false"><div class="hint">Valeur par défaut : gemini-3.5-flash-lite.</div><div class="row"><button id="save">Enregistrer</button><button id="clear" class="secondary">Supprimer la clé</button></div><div class="saved" id="saved"></div></div></div><script src="settings.js"></script></body></html>
